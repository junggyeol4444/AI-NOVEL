name: ANF compiled Windows EXE full authoring journey (VALIDATION ONLY)
on:
  push:
    branches: [main]
  workflow_dispatch:
# Validation-only: a newer candidate supersedes a queued earlier candidate.
# Do not change the pre-existing hourly/scheduled workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compiled-windows-authoring:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      ANF_AI_PROVIDER: disabled
      ANF_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI and real CPU LLM dependencies on disposable Windows runner
        run: |
          python -m pip install -e ".[desktop,build]"
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.48.3" "huggingface_hub==0.28.1"
      - name: Download public model weights only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/ci/model | Out-Null
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='HuggingFaceTB/SmolLM2-135M-Instruct', local_dir='build/ci/model')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Syntax check
        run: python -m compileall -q src scripts packaging/windows
      - name: Fetch pinned SIL OFL Korean font for offline packaged GUI
        run: python scripts/prepare_gui_font.py
      - name: Build actual Windows EXE
        run: python scripts/build_windows_exe.py --report build/ci/compiled_build.json
      - name: Keep synthetic Windows build diagnostics (never include novels or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-windows-build-diagnostics
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/stage97/build_stdout.txt
            build/stage97/build_stderr.txt
            build/stage97/smoke_check_stdout.txt
            build/stage97/smoke_check_stderr.txt
            build/stage97/smoke_gui-smoke_stdout.txt
            build/stage97/smoke_gui-smoke_stderr.txt
            build/ci/compiled_build.json
      - name: Drive compiled EXE GUI and local model via actual Qt click events
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          $py = (Get-Command python).Source
          $model = (Resolve-Path build/ci/model).Path
          $provider = (Resolve-Path scripts/ci_real_model.py).Path
          $out = Join-Path (Get-Location).Path "build/ci/journey"
          python -c "import subprocess,sys; sys.exit(subprocess.run(sys.argv[1:], timeout=480).returncode)" ./dist/stage97/AI_Novel_Factory.exe --ci-authoring-journey $py $model $provider $out
          $code = $LASTEXITCODE
          if (Test-Path build/ci/journey/compiled_exe_user_journey.json) {
            Get-Content build/ci/journey/compiled_exe_user_journey.json
          }
          if ($code -ne 0) { exit 1 }
          python -c "import json; p=json.load(open('build/ci/journey/compiled_exe_user_journey.json',encoding='utf8')); assert p['whole_user_journey']=='PASS' and len(p['steps'])>=12 and all(x['result']=='PASS' for x in p['steps'])"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload Windows QA-only unsigned EXE (no models or manuscripts)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANF-Windows-QA-Unsigned-Not-A-Release
          retention-days: 7
          if-no-files-found: error
          path: dist/stage97/AI_Novel_Factory.exe
      - name: Build standalone local GGUF model console bridge EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name ANF_Local_Model --distpath build/ci/bridge-dist --workpath build/ci/bridge-work packaging/windows/local_model_bridge.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build complete offline QA portable folder with public model weights
        shell: pwsh
        env:
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python scripts/build_portable_ai_bundle.py --gui-exe dist/stage97/AI_Novel_Factory.exe --bridge-exe build/ci/bridge-dist/ANF_Local_Model.exe --output build/ci/portable-bundle
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Run real bundled GGUF AI inference offline through compiled console bridge
        shell: pwsh
        run: |
          python scripts/ci_portable_model_e2e.py build/ci/portable-bundle
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Drive packaged GUI with bundled real GGUF model and restart saved novel
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          $exe = (Resolve-Path build/ci/portable-bundle/AI_Novel_Factory.exe).Path
          $out = Join-Path (Get-Location).Path 'build/ci/portable-gui'
          python -c "import subprocess,sys;sys.exit(subprocess.run(sys.argv[1:], timeout=270).returncode)" $exe --ci-portable-gui $out
          $code = $LASTEXITCODE
          if (Test-Path build/ci/portable-gui/portable_gui_report.json) {
            Get-Content build/ci/portable-gui/portable_gui_report.json
          }
          if ($code -ne 0) { exit 1 }
          python -c "import json; r=json.load(open('build/ci/portable-gui/portable_gui_report.json',encoding='utf-8'));assert r['result']=='PASS' and all(s['result']=='PASS' for s in r['steps'])"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload full offline Windows portable QA bundle with public GGUF weights
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANF-Full-Offline-Portable-QA-Windows-x64-Not-Release
          retention-days: 7
          if-no-files-found: error
          path: build/ci/portable-bundle/
      - name: Save metadata evidence, no user manuscripts or credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-compiled-gui-journey
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci/compiled_build.json
            build/ci/journey/compiled_exe_user_journey.json
            build/ci/portable_model_e2e.json
            build/ci/portable-gui/portable_gui_report.json
            build/ci/portable-gui/restarted_report.json

  windows11-complete-offline-app:
    if: github.ref == 'refs/heads/main'
    needs: compiled-windows-authoring
    runs-on: windows-11-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ANF-Full-Offline-Portable-QA-Windows-x64-Not-Release
          path: build/ci/qa_bundle
      - name: Windows 11 actual OS with x64 EXE emulation and offline GGUF GUI user journey
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("Actual OS: " + $os.Caption + "; arch " + $env:PROCESSOR_ARCHITECTURE)
          if ($os.Caption -notmatch 'Windows 11' -or $env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw 'Required real Windows 11 ARM64 OS was not found'
          }
          $exe = (Resolve-Path 'build/ci/qa_bundle/AI_Novel_Factory.exe').Path
          $out = Join-Path (Get-Location).Path 'build/ci/win11-standalone'
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @('--ci-portable-gui', ('"' + $out + '"')) -PassThru -Wait
          if (Test-Path (Join-Path $out 'portable_gui_report.json')) {
            $report = Get-Content (Join-Path $out 'portable_gui_report.json') -Raw | ConvertFrom-Json
            Write-Host ('Result: ' + $report.result)
            foreach ($check in $report.steps) {
              Write-Host ($check.step + ': ' + $check.result)
            }
          } else {
            throw 'Compiled portable app never saved a Windows 11 GUI report'
          }
          $failedChecks = @($report.steps | Where-Object { $_.result -ne 'PASS' })
          if (($p.ExitCode -ne 0) -or ($report.result -ne 'PASS') -or ($failedChecks.Count -gt 0)) {
            throw 'Windows 11 complete offline model, Qt GUI, persistence or EPUB workflow failed'
          }
          Write-Host 'PASS: real Windows 11 ARM OS x64 emulation; Qt offscreen GUI; GGUF inference; SQLite and EPUB; independent EXE restart.'
          Write-Host 'Not a human interactive desktop visual signoff.'
      - name: Preserve only metadata, never synthetic novel or model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-windows11-full-portable-qa-metadata
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci/win11-standalone/portable_gui_report.json
            build/ci/win11-standalone/restarted_report.json
