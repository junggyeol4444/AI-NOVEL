name: AI Novel Factory Windows targeted SQLite regression (TEST ONLY)

on:
  push:
    branches:
      - validation/windows-targeted-ci-100
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win-sqlite:
    if: github.ref == 'refs/heads/validation/windows-targeted-ci-100'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      ANF_AI_PROVIDER: disabled
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full runtime and test extras into disposable Windows runner
        shell: pwsh
        run: |
          python -m pip install -e ".[desktop,api,database,queue,documents,graphics,quality,dev,build]"
      - name: Verify Windows SQLite cleanup and 120-episode synthetic trial regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$((Get-Location).Path)\src;$((Get-Location).Path)\tests"
          New-Item -ItemType Directory -Force -Path build/ci | Out-Null
          python scripts/windows_unittest_entry.py -q test_stage87_long_memory_stability_trial test_stage74_foreshadow_checker test_stage95_publisher_asset_review 2>&1 | Tee-Object -FilePath build/ci/windows_sqlite_targeted.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload targeted results, not source or user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-win-sqlite-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: build/ci/windows_sqlite_targeted.txt
