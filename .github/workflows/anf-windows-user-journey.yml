name: ANF Windows TRUE user-journey acceptance (TEST BRANCH ONLY)
on:
  push:
    branches:
      - validation/real-user-journey-ci-100
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-user-journey:
    if: github.ref == 'refs/heads/validation/real-user-journey-ci-100'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ANF_AI_PROVIDER: disabled
      ANF_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application + build and GUI dependencies only on disposable test runner
        shell: pwsh
        run: |
          python -m pip install -e ".[desktop,api,database,queue,documents,graphics,quality,dev,build]"
      - name: Build ACTUAL Windows EXE from this same test branch
        shell: pwsh
        run: |
          python scripts/build_windows_exe.py --report build/ci/user_journey_windows_build.json
          exit $LASTEXITCODE
      - name: Windows compiled GUI startup plus actual user click journey, no individual-unit shortcuts
        shell: pwsh
        run: |
          python scripts/ci_windows_user_journey.py
          exit $LASTEXITCODE
      - name: Preserve REAL BLOCKERS; failed user journey remains a FAILED CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-windows-real-user-journey-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/ci/windows_actual_user_journey.json
            build/ci/windows_actual_user_journey.png
            build/ci/user_journey_windows_build.json
