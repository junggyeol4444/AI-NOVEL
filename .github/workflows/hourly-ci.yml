name: AI Novel Factory hourly verification

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python project checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm source migration
        id: source
        shell: bash
        run: |
          if [ -d src/ai_novel_factory ] && [ -d tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Project source detected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stage16 sources have not yet been migrated to GitHub."
            echo "Source migration pending: no Python tests were run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install test packages
        if: steps.source.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pypdf>=5,<7" "fastapi>=0.115,<1" "httpx>=0.27,<1" "python-docx>=1.1,<2"
      - name: Check Python syntax
        if: steps.source.outputs.present == 'true'
        run: python -m compileall -q src tests scripts
      - name: Run automated tests
        if: steps.source.outputs.present == 'true'
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Clarify scheduling scope
        if: always()
        run: |
          echo "This scheduled workflow checks existing GitHub source only." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not independently generate or commit new code." >> "$GITHUB_STEP_SUMMARY"
