name: AI Novel Factory hourly verification

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hourly-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install available test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pypdf>=5,<7" "fastapi>=0.115,<1" "httpx>=0.27,<1" "python-docx>=1.1,<2"
      - name: Python syntax check
        run: python -m compileall -q src tests scripts
      - name: Project tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Record run summary
        if: always()
        run: |
          echo "Hourly CI validates checked-in source only." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not write new AI-generated code automatically." >> "$GITHUB_STEP_SUMMARY"
