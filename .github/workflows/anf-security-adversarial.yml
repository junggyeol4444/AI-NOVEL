name: ANF SQL and malicious EPUB XML adversarial tests (TEST BRANCH ONLY)
on:
  push:
    branches:
      - validation/security-adversarial-ci-100
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-security:
    if: github.ref == 'refs/heads/validation/security-adversarial-ci-100'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2022]
    env:
      ANF_AI_PROVIDER: disabled
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project on disposable test runner only
        run: python -m pip install -e .
      - name: Check actual SQL injection attempts and XML entity attacks
        run: python scripts/ci_security_adversarial.py
