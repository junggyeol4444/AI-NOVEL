name: ANF fast user-first studio regression (VALIDATION ONLY)
on:
  push:
    branches: [validation/gui-authoring-e2e-20261014]
  workflow_dispatch:
# Validation-only: a newer candidate supersedes a queued earlier candidate.
# Do not change the pre-existing hourly/scheduled workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fast-studio-qt-not-human-acceptance:
    if: github.ref == 'refs/heads/validation/gui-authoring-e2e-20261014'
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ANF_ENV: test
      ANF_AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local GUI only (no model, user files or credentials)
        run: python -m pip install -e ".[desktop]"
      - name: Basic syntax and navigation checks
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -p test_desktop_navigation.py -v
      - name: Data safety for new SQLite projects, optional author and race preservation
        run: python -m unittest discover -s tests -p test_authoring_session_safety.py -v
      - name: Real local Qt widget clicks and SQLite versioned user journey
        run: python -m unittest discover -s tests -p test_studio_gui_optional.py -v
