name: ANF Linux quick studio and data safety (VALIDATION ONLY)
on:
  push:
    branches: [validation/gui-authoring-e2e-20261014]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-offscreen-qt-safety-not-windows-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ANF_ENV: test
      ANF_AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI dependencies, no models, no credentials
        run: python -m pip install -e ".[desktop]"
      - name: Syntax check
        run: python -m compileall -q src
      - name: Existing navigation regression
        run: python -m unittest discover -s tests -p test_desktop_navigation.py -v
      - name: Exclusive SQLite create and race-safety regression
        run: python -m unittest discover -s tests -p test_authoring_session_safety.py -v
      - name: Actual Qt offscreen buttons create, edit, persist, reopen and reject conflict
        run: python -m unittest discover -s tests -p test_studio_gui_optional.py -v
      - name: Synthetic GUI screenshots with real Qt widgets
        run: python scripts/ci_studio_snapshots.py build/ci/studio-synthetic-screens
      - name: Preserve ONLY synthetic GUI screenshots for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-linux-studio-qt-synthetic-screens
          path: build/ci/studio-synthetic-screens/
          if-no-files-found: warn
          retention-days: 7
      - name: No physical Windows claim
        run: echo "This is Linux offscreen functional QA only, NOT Win10/11 desktop acceptance."
