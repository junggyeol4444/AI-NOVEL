name: AI Novel Factory ephemeral local services (TEST BRANCH ONLY)

on:
  push:
    branches:
      - validation/service-ci-100
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-services:
    if: github.ref == 'refs/heads/validation/service-ci-100'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anf_ci
          POSTGRES_PASSWORD: anf_ci_only
          POSTGRES_DB: anf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anf_ci -d anf_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANF_CI_SYNTHETIC_SERVICES: '1'
      ANF_CI_POSTGRES_DSN: postgresql://anf_ci:anf_ci_only@127.0.0.1:5432/anf_ci
      ANF_AI_PROVIDER: disabled
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies on isolated runner
        run: python -m pip install -e '.[database,queue]'
      - name: Test live loopback Redis, Celery worker and PostgreSQL pgvector
        run: python scripts/ci_local_services.py
      - name: Save synthetic-only test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-services-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: build/ci/local_services.json
