name: ANF full synthetic unit regression (VALIDATION ONLY)
on:
  push:
    branches: [validation/gui-authoring-e2e-20261014]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-synthetic-tests-no-live-accounts:
    if: github.ref == 'refs/heads/validation/gui-authoring-e2e-20261014'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      ANF_ENV: test
      ANF_AI_PROVIDER: disabled
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONFAULTHANDLER: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offscreen Qt libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 fonts-noto-cjk
      - name: Install synthetic test dependencies without AI weights or credentials
        run: python -m pip install -e ".[desktop,api,database,queue,documents,graphics,quality]"
      - name: Full unittest discovery in disposable runner
        shell: bash
        run: |
          mkdir -p build/ci/full-unittest
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee build/ci/full-unittest/unittest.log
          exit ${PIPESTATUS[0]}
      - name: Preserve complete test output for investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-full-unittest-${{ runner.os }}
          path: build/ci/full-unittest/unittest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Clarify acceptance scope
        if: success()
        run: echo "Synthetic Linux/Windows CI tests only; NOT physical Windows acceptance, quality certification, real publishing or full-model long-form proof."
