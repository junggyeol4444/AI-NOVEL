name: AI Novel Factory real local CPU model IPC (TEST BRANCH ONLY)

on:
  push:
    branches:
      - validation/local-model-ci-100
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-model:
    if: github.ref == 'refs/heads/validation/local-model-ci-100'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      ANF_AI_PROVIDER: disabled
      PYTHONPATH: src
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU inference programs only on ephemeral test runner
        run: |
          python -m pip install -e .
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.48.3' 'huggingface_hub==0.28.1'
      - name: Download public compact model weights for LOCAL inference
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='HuggingFaceTB/SmolLM2-135M-Instruct', local_dir='build/ci/model')
          PY
      - name: Validate offline model invocation with ANF local executable provider
        env:
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_OFFLINE: '1'
        run: python scripts/ci_real_model.py --run "${{ github.workspace }}/build/ci/model"
      - name: Upload checksum metadata only; exclude weights and scene text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-real-model-metadata-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: build/ci/real_cpu_model.json
