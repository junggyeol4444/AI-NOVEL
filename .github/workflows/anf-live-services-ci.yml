name: ANF real local PostgreSQL pgvector Redis Celery (VALIDATION ONLY)
on:
  push:
    branches: [validation/gui-authoring-e2e-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-local-database-vector-queue:
    if: github.ref == 'refs/heads/validation/gui-authoring-e2e-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anfci
          POSTGRES_DB: anfci
          POSTGRES_PASSWORD: synthetic-only-disposable-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anfci -d anfci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      ANF_DISPOSABLE_SERVICE_CI: '1'
      ANF_CI_POSTGRES_DSN: postgresql://anfci:synthetic-only-disposable-ci@127.0.0.1:5432/anfci
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual PostgreSQL pgvector Redis and Celery clients
        run: python -m pip install -e ".[database,queue]"
      - name: Prove official WordPress DRAFT adapter fails closed using local no-network requests
        run: python -m unittest discover -s tests -p test_validation_wordpress_draft.py -v
      - name: Prove SQL insertion + filtered pgvector query + Redis worker consumption
        run: python -m ai_novel_factory.service_integration_ci
      - name: Save anonymized validation status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-live-postgres-pgvector-redis-celery
          retention-days: 7
          if-no-files-found: warn
          path: build/ci/services_live.json
