name: AI Novel Factory GUI navigation and screenshot (TEST BRANCH ONLY)

on:
  push:
    branches:
      - validation/gui-ci-100
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-offscreen:
    if: github.ref == 'refs/heads/validation/gui-ci-100'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      ANF_AI_PROVIDER: disabled
    steps:
      - name: Checkout GUI test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Qt runtime libraries on test runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-noto-cjk
      - name: Install desktop GUI test dependencies in isolated runner
        run: python -m pip install -e '.[desktop]'
      - name: Verify all 12 Qt screens and screenshot
        run: python scripts/ci_gui_nav.py
      - name: Upload screenshot and navigation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-gui-navigation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/ci/gui_nav.png
            build/ci/gui_report.json
