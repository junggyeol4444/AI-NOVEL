name: ANF full Windows unittest matrix (ISOLATED TEST BRANCH)
on:
  push:
    branches:
      - validation/windows-acceptance-ci-100
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-regression:
    if: github.ref == 'refs/heads/validation/windows-acceptance-ci-100'
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      ANF_AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install full optional requirements on this ephemeral Windows runner only
        shell: pwsh
        run: |
          python -m pip install -e ".[desktop,api,database,queue,documents,graphics,quality,dev,build]"
      - name: Execute disjoint unittest group
        shell: pwsh
        run: |
          python scripts/stage99_partitioned_regression.py --prefix build/ci/matrix --start ${{ matrix.group }} --end ${{ matrix.group }}
          exit $LASTEXITCODE
      - name: Preserve the actual stdout, stderr and exit code of group
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-windows-matrix-group-${{ matrix.group }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci/matrix_group${{ matrix.group }}_stderr.txt
            build/ci/matrix_group${{ matrix.group }}_stdout.txt
            build/ci/matrix_group${{ matrix.group }}_exit.txt

  evidence-and-native-exe:
    needs: windows-regression
    if: github.ref == 'refs/heads/validation/windows-acceptance-ci-100'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      ANF_AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download real logs from all 8 Windows group jobs of this run
        uses: actions/download-artifact@v4
        with:
          pattern: anf-windows-matrix-group-*-${{ github.run_id }}
          merge-multiple: true
          path: build/ci
      - name: Aggregate exact module coverage and all original exit codes
        shell: pwsh
        run: |
          python scripts/stage99_partitioned_regression.py --prefix build/ci/matrix --aggregate
          exit $LASTEXITCODE
      - name: Install Windows EXE build dependencies only on disposable runner
        shell: pwsh
        run: |
          python -m pip install -e ".[desktop,api,database,queue,documents,graphics,quality,dev,build]"
      - name: Build native Windows PyInstaller EXE and perform GUI smoke
        shell: pwsh
        run: |
          python scripts/build_windows_exe.py --report build/ci/stage97_build.json
          exit $LASTEXITCODE
      - name: Independently cross-check EXE hash, smoke, and 8-group Windows regression
        shell: pwsh
        run: |
          python scripts/ci_windows_matrix_acceptance.py
          exit $LASTEXITCODE
      - name: Upload verified Windows evidence and test-only EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-windows-integrated-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci/matrix_groups.json
            build/ci/stage97_build.json
            build/ci/windows_matrix_acceptance.json
            dist/stage97/AI_Novel_Factory.exe
