name: ANF native Windows EXE Korean manuscript acceptance (VALIDATION ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/anf-real-windows-exe-korean-literary-gate.yml'
      - 'packaging/windows/local_model_bridge.py'
      - 'scripts/ci_native_llama_diagnostic.py'
      - 'tests/test_native_manuscript_purity.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-current-korean-model-bridge:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject actual llama-cli console banners as Korean novel (source contract, not literary PASS)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_native_manuscript_purity.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native manuscript console purity regression failed' }
      - name: Build current source into native console EXE (not a Python mock)
        shell: pwsh
        run: |
          python -m pip install -e ".[desktop,build]"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller dependency failed' }
          python -m PyInstaller --noconfirm --onefile --console --name ANF_Local_Model --distpath build/ci/newbridge --workpath build/ci/newbridge-work packaging/windows/local_model_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Current bridge build failed' }
          if (-not (Test-Path build/ci/newbridge/ANF_Local_Model.exe)) { throw 'Current bridge EXE missing' }
          python scripts/prepare_gui_font.py
          if ($LASTEXITCODE -ne 0) { throw 'Korean GUI font preparation failed' }
          python scripts/build_windows_exe.py --report build/ci/korean-gui-build.json
          if ($LASTEXITCODE -ne 0) { throw 'Current GUI EXE compilation failed' }
          if (-not (Test-Path dist/stage97/AI_Novel_Factory.exe)) { throw 'Current GUI EXE missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: anf-korean-bridge-from-current-commit
          path: build/ci/newbridge/ANF_Local_Model.exe
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: anf-current-compiled-windows-GUI-exe
          path: dist/stage97/AI_Novel_Factory.exe
          retention-days: 3
          if-no-files-found: error
  real-windows-exe-external-gui-korean-5000:
    needs: build-current-korean-model-bridge
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download actual compiled Windows GUI and public offline GGUF bundle
        uses: actions/download-artifact@v4
        with:
          run-id: 38824690498
          name: ANF-Full-Offline-Portable-QA-Windows-x64-Not-Release
          path: build/ci/real-windows-bundle
          github-token: ${{ github.token }}
      - name: Download current-commit compiled GUI executable
        uses: actions/download-artifact@v4
        with:
          name: anf-current-compiled-windows-GUI-exe
          path: build/ci/current-gui
      - name: Download current-commit compiled bridge executable
        uses: actions/download-artifact@v4
        with:
          name: anf-korean-bridge-from-current-commit
          path: build/ci/current-model-bridge
      - name: Download updated native bridge from current source and stage multilingual QA weight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bridge=Get-ChildItem 'build/ci/real-windows-bundle' -Recurse -File -Filter 'ANF_Local_Model.exe' | Select-Object -First 1
          if (-not $bridge) { throw 'QA bundle native bridge missing' }
          $qaRoot=$bridge.DirectoryName
          $newBridge='build/ci/current-model-bridge/ANF_Local_Model.exe'
          if (-not (Test-Path $newBridge)) { throw 'Current branch compiled model bridge missing' }
          Copy-Item -LiteralPath $newBridge -Destination $bridge.FullName -Force
          $newGui='build/ci/current-gui/AI_Novel_Factory.exe'
          if (-not (Test-Path $newGui)) { throw 'Current branch GUI EXE missing' }
          Copy-Item -LiteralPath $newGui -Destination (Join-Path $qaRoot 'AI_Novel_Factory.exe') -Force
          $model=Join-Path $qaRoot 'models/qwen2.5-1.5b-instruct-q4_k_m.gguf'
          $url='https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf'
          curl.exe --fail --location --retry 2 --max-time 300 --output $model $url
          if ($LASTEXITCODE -ne 0) { throw 'Public Qwen GGUF download failed' }
          $size=(Get-Item $model).Length
          if($size -lt 900000000 -or $size -gt 1400000000){throw 'Public Qwen GGUF size out of allowed range'}
          Write-Host ('Current bridge and public QA Qwen GGUF ready. Weight bytes: '+$size)
      - name: Compare real llama interactive CLI against Qwen raw completion (synthetic, not literary PASS)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bridge=Get-ChildItem 'build/ci/real-windows-bundle' -Recurse -File -Filter 'ANF_Local_Model.exe' | Select-Object -First 1
          if(-not $bridge){throw 'Native bridge not staged'}
          $env:ANF_QA_CLI=Join-Path $bridge.DirectoryName 'runtime/llama-cli.exe'
          $env:ANF_QA_GGUF=Join-Path $bridge.DirectoryName 'models/qwen2.5-1.5b-instruct-q4_k_m.gguf'
          python scripts/ci_native_llama_diagnostic.py
          if($LASTEXITCODE -ne 0){throw 'Native CLI diagnostic execution failed'}
      - name: Operate real Windows EXE via EXTERNAL UIAutomation and test original Korean prose
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $env:QT_QPA_PLATFORM='windows'
          $bridge=Get-ChildItem 'build/ci/real-windows-bundle' -Recurse -File -Filter 'ANF_Local_Model.exe' | Select-Object -First 1
          if (-not $bridge) { throw 'qa_bundle_missing' }
          $root=$bridge.DirectoryName
          $exe=Join-Path $root 'AI_Novel_Factory.exe'
          if (-not (Test-Path $exe)) { throw 'actual_gui_executable_missing' }
          $qa=Join-Path $env:RUNNER_TEMP ('anf-korean-gui-'+[guid]::NewGuid().ToString('N'))
          New-Item -Path $qa -ItemType Directory -ErrorAction Stop | Out-Null
          $db=Join-Path $qa 'only-synthetic.sqlite'
          $report=@{ mode='EXTERNAL_UIAUTOMATION_COMPILED_WINDOWS_GUI_REAL_GGUF'; status='FAIL'; korean_5000='FAIL'; literary_quality='NOT_CERTIFIED'; human_physical_acceptance='NOT_RUN'; reference_full_similarity='NOT_RUN'; user_data_accessed=$false; publication_executed=$false; current_stage='startup' }
          $process=$null
          function Ui([string]$id,[string]$name) {
            $matches=[System.Collections.Generic.List[System.Windows.Automation.AutomationElement]]::new()
            foreach($pair in @(@('id',$id),@('name',$name))){
              $property=if($pair[0] -eq 'id') {[System.Windows.Automation.AutomationElement]::AutomationIdProperty}else{[System.Windows.Automation.AutomationElement]::NameProperty}
              $cond=[System.Windows.Automation.PropertyCondition]::new($property,[string]$pair[1])
              foreach($x in $script:window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$cond)){$matches.Add($x)}
            }
            if($matches.Count -eq 0){return $null}
            # Qt labels can reuse the editor's accessibility name/ID; never send text to a static Text control.
            foreach($x in $matches){
              if($x.Current.ControlType.ProgrammaticName -in @('ControlType.Edit','ControlType.Document')){
                $vp=$null
                if($x.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$vp)){return $x}
              }
            }
            foreach($x in $matches){
              if($x.Current.ControlType.ProgrammaticName -in @('ControlType.Edit','ControlType.Document')){return $x}
            }
            foreach($x in $matches){
              if($x.Current.ControlType.ProgrammaticName -in @('ControlType.Button','ControlType.CheckBox')){return $x}
            }
            return $matches[0]
          }
          function SetField([string]$id,[string]$name,[string]$value) {
            $script:last_ui_control=$id
            $control=Ui $id $name
            if ($null -eq $control) { throw ('gui_field_not_found_'+$id) }
            $pattern=$null
            if ($control.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$pattern)) {
              ([System.Windows.Automation.ValuePattern]$pattern).SetValue($value)
            } else {
              $report.uia_missing_value_control_type=$control.Current.ControlType.ProgrammaticName
              $report.uia_missing_value_patterns=@($control.GetSupportedPatterns() | ForEach-Object {$_.ProgrammaticName})
              $legacy=$null
              if ($control.TryGetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern,[ref]$legacy)) {
                ([System.Windows.Automation.LegacyIAccessiblePattern]$legacy).SetValue($value)
              } else {
                throw ('gui_value_and_legacy_patterns_missing_'+$id)
              }
            }
          }
          function Press([string]$id,[string]$name) {
            $script:last_ui_control=$id
            $control=Ui $id $name
            if ($null -eq $control) { throw ('gui_button_not_found_'+$id) }
            $pattern=$null
            if (-not $control.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern,[ref]$pattern)) { throw ('gui_invoke_pattern_missing_'+$id) }
            ([System.Windows.Automation.InvokePattern]$pattern).Invoke()
            Start-Sleep -Milliseconds 400
          }
          try {
            $report.current_stage='launch_visible_windows_exe'
            $process=Start-Process -FilePath $exe -PassThru
            $hwnd=[IntPtr]::Zero
            for($i=0;$i -lt 80;$i++){
              Start-Sleep -Milliseconds 500
              foreach($p in @(Get-Process -Name AI_Novel_Factory -ErrorAction SilentlyContinue)){
                $p.Refresh()
                if($p.MainWindowHandle -ne [IntPtr]::Zero -and $p.MainWindowTitle -match 'AI Novel Factory') { $hwnd=$p.MainWindowHandle; break }
              }
              if($hwnd -ne [IntPtr]::Zero){break}
            }
            if($hwnd -eq [IntPtr]::Zero){ throw 'compiled_exe_visible_window_not_found' }
            $script:window=[System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
            if($null -eq $script:window){throw 'uia_attach_failed'}
            $report.real_exe_window_visible=$true
            $report.windows_runner=$env:RUNNER_OS
            $osInfo=Get-CimInstance Win32_OperatingSystem
            $report.windows_version=$osInfo.Caption
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class ANFNativeForeground {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          '@
            [void][ANFNativeForeground]::SetForegroundWindow($hwnd)
            Start-Sleep -Milliseconds 300
            $report.native_foreground_matches_gui=([ANFNativeForeground]::GetForegroundWindow() -eq $hwnd)
            $report.current_stage='enter_author_owned_korean_project_via_uia'
            Press 'studioAdvancedButton' '세부 작업 도구'
            SetField 'authoring_db' '로컬 DB 파일 경로' $db
            SetField 'authoring_title' '작품 제목' '가상 한국어 문학 검사'
            SetField 'authoring_author' '작가 이름' '합성 독립 검증'
            SetField 'authoring_premise' '최상위 설정' '가상의 섬에서 과거의 기록을 복원하는 조사자의 모험. 저작권 있는 참고작 없이 창작.'
            SetField 'authoring_genre' '장르' '한국어 현대 판타지'
            SetField 'authoring_subject' '소재/핵심 아이디어' '가상 섬의 도서관, 기억과 선택'
            SetField 'authoring_target_episodes' '목표 회차 수 (1~1000000)' '250'
            SetField 'authoring_characters_per_episode' '회차당 목표 글자 수' '5000'
            SetField 'authoring_mood' '분위기' '절제된 한국어 문학적 서술'
            Press 'createProjectButton' '새 작품 생성'
            if(-not (Test-Path $db)){throw 'gui_project_sqlite_not_created'}
            SetField 'authoring_bible' '설정' '가상 섬에는 계급도 마법도 없다. 주인공은 조사자이고, 사건의 실마리는 낡은 도서관 기록에 있다. 기존 작품 문장·고유명사 사용 금지.'
            Press 'authoring_save_bible' '설정 저장'
            SetField 'authoring_plot' '회차 플롯' '첫 회에서 조사자는 기록의 빈 페이지를 발견하고 스스로 원인을 추적한다.'
            Press 'authoring_create_episode' '새 회차 생성'
            Press 'authoring_add_scene' '장면 추가'
            SetField 'authoring_scene' '장면 플롯' '도서관에서 비가 시작되고, 주인공이 사라진 날짜를 발견한다.'
            Press 'authoring_save_scene' '장면 저장'
            SetField 'authoring_goal' '장면 목표' '완전한 한국어로 독창적인 첫 장면을 약 5000자 작성한다. 영어 문장이나 반복 문장은 사용하지 않는다.'
            SetField 'authoring_conflict' '갈등' '날짜 기록이 실제 기억과 어긋나면서 주인공은 증거를 다시 확인한다.'
            SetField 'authoring_location' '장소' '완전히 가상의 섬 도서관'
            SetField 'authoring_characters' '등장인물 (쉼표 구분)' '조사자, 사서'
            $modelQaPath=Join-Path $root 'models/qwen2.5-1.5b-instruct-q4_k_m.gguf'
            if(-not (Test-Path $modelQaPath)){throw 'selected_qa_korean_model_missing'}
            SetField 'authoring_arguments' '실행 인수' ('--gguf "'+$modelQaPath+'"')
            $report.qa_model='Qwen2.5-1.5B-Instruct-Q4_K_M'
            $report.model_variant='downloaded_public_weights_ci_only'
            $modelControl=Ui 'authoring_executable' '신뢰한 실행 파일 절대 경로'
            if($null -eq $modelControl){throw 'bundled_gui_model_field_missing'}
            $pval=$null
            if(-not $modelControl.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$pval)){throw 'model_path_not_readable'}
            $actualPath=([System.Windows.Automation.ValuePattern]$pval).Current.Value
            if($actualPath -ne (Join-Path $root 'ANF_Local_Model.exe')){throw 'bundled_model_not_selected_in_real_gui'}
            $approval=Ui 'authoringLocalModelApproval' '이 로컬 실행 파일의 이번 실행을 승인합니다'
            if($null -eq $approval){throw 'model_approval_control_missing'}
            $pt=$null
            if(-not $approval.TryGetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern,[ref]$pt)){throw 'model_approval_toggle_pattern_missing'}
            if(([System.Windows.Automation.TogglePattern]$pt).Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){([System.Windows.Automation.TogglePattern]$pt).Toggle()}
            $report.current_stage='click_actual_gui_generate_local_gguf'
            Press 'generateSceneWithLocalModel' '로컬 AI 초고 생성'
            $editor=$null
            for($i=0;$i -lt 1200;$i++){
              Start-Sleep -Milliseconds 400
              $editor=Ui 'authoring_draft' '검토 가능한 초고'
              # An actual GUI failure must end this test promptly, not
              # masquerade as an eight-minute empty manuscript timeout.
              if($i % 5 -eq 0){
                $liveStatus=Ui 'authoringStatus' '로컬 AI 집필 중'
                if($null -ne $liveStatus){
                  $safeStatus=[string]$liveStatus.Current.Name
                  if($safeStatus -match '^로컬 AI 생성 실패'){
                    if($safeStatus -match 'native_timeout'){$report.gui_model_failure='native_timeout'}
                    elseif($safeStatus -match 'native_output_rejected'){$report.gui_model_failure='native_output_rejected'}
                    elseif($safeStatus -match 'native_inference_failure'){$report.gui_model_failure='native_inference_failure'}
                    elseif($safeStatus -match 'LocalModelError'){$report.gui_model_failure='LocalModelError'}
                    else{$report.gui_model_failure='UnknownError'}
                    throw 'real_native_model_failed_before_draft'
                  }
                }
              }
              if($null -ne $editor){
                $tempPattern=$null
                if($editor.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$tempPattern)){
                  $text=([System.Windows.Automation.ValuePattern]$tempPattern).Current.Value
                  if(-not [string]::IsNullOrWhiteSpace($text)){break}
                }
              }
            }
            if($null -eq $editor){throw 'generated_draft_gui_field_missing'}
            $pv=$null
            if($editor.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$pv)){
              $draft=([System.Windows.Automation.ValuePattern]$pv).Current.Value
            } else {
              $tp=$null
              if(-not $editor.TryGetCurrentPattern([System.Windows.Automation.TextPattern]::Pattern,[ref]$tp)){throw 'generated_manuscript_uia_text_pattern_missing'}
              $draft=([System.Windows.Automation.TextPattern]$tp).DocumentRange.GetText(-1)
            }
            if(-not $draft){
              $statusView=Ui 'authoringStatus' '로컬 전용'
              if($null -ne $statusView){
                $statusName=[string]$statusView.Current.Name
                if($statusName -match 'native_timeout'){$report.gui_model_failure='native_timeout'}
                elseif($statusName -match 'native_inference_failure'){$report.gui_model_failure='native_inference_failure'}
                elseif($statusName -match 'native_output_rejected'){$report.gui_model_failure='native_output_rejected'}
                elseif($statusName -match 'LocalModelError'){$report.gui_model_failure='LocalModelError'}
                elseif($statusName -match '작품/회차/장면이 변경'){$report.gui_model_failure='stale_editor'}
                else{$report.gui_model_failure='no_sanitized_category'}
              }
              throw 'real_model_generated_empty_draft'
            }
            $report.current_stage='validate_korean_5000_no_english_padding'
            $nonspace=[regex]::Replace($draft,'\s','')
            $hangul=[regex]::Matches($nonspace,'[\uAC00-\uD7A3]').Count
            $latin=[regex]::Matches($nonspace,'[A-Za-z]').Count
            $report.total_chars=$draft.Length
            $report.nonspace_chars=$nonspace.Length
            $report.hangul_syllables=$hangul
            $report.latin_letters=$latin
            $report.hangul_share=[math]::Round($hangul/[math]::Max(1,$nonspace.Length),4)
            $parts=@($draft -split '(?<=[.!?。])\s+|\r?\n+' | Where-Object {$_.Trim().Length -ge 16})
            $unique=@($parts | ForEach-Object {$_.Trim()} | Select-Object -Unique)
            $report.sentence_units=$parts.Count
            $report.unique_sentence_units=$unique.Count
            $report.repeated_sentence_share=[math]::Round(1-($unique.Count/[math]::Max(1,$parts.Count)),4)
            $qualityLabel=Ui 'authoringStatus' '한국어 형식 검사 미달'
            if($null -eq $qualityLabel){$qualityLabel=Ui 'authoringStatus' '한국어 형식 1차 검사 충족'}
            if($null -eq $qualityLabel){throw 'actual_windows_gui_quality_status_missing'}
            $qualityMessage=[string]$qualityLabel.Current.Name
            if($qualityMessage -match '한국어 형식 검사 미달'){$report.gui_quality_status='REJECTED_BY_REAL_GUI'}
            elseif($qualityMessage -match '한국어 형식 1차 검사 충족'){$report.gui_quality_status='FORMAT_CHECK_ONLY'}
            else{$report.gui_quality_status='UNRECOGNIZED'}
            # Windows UIA and Qt may normalize CRLF differently. Hash only
            # normalized text; never write model manuscripts into CI artifacts.
            $normalizedDraft=$draft.Replace("`r`n","`n").Replace("`r","`n")
            $sha=[System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($normalizedDraft))
            $report.draft_sha256=[Convert]::ToHexString($sha).ToLowerInvariant()
            $report.current_stage='verify_actual_gui_sqlite_saved_draft'
            Press 'saveAuthoringDraftButton' '검토한 초고 SQLite 저장'
            $env:ANF_QA_SYNTHETIC_DB=$db
            $env:ANF_QA_EXPECTED_HASH=$report.draft_sha256
            python scripts/ci_verify_gui_draft_sqlite.py
            if($LASTEXITCODE -ne 0){throw 'actual_compiled_gui_sqlite_draft_mismatch'}
            $report.sqlite_readonly_reopened=$true
            $report.saved_via_gui=$true
            $report.korean_5000= if($hangul -ge 4500 -and $nonspace.Length -ge 4500 -and $report.hangul_share -ge 0.78 -and $latin -le 0.05*$nonspace.Length -and $report.repeated_sentence_share -le 0.12 -and $parts.Count -ge 10 -and $report.native_foreground_matches_gui -and $report.gui_quality_status -eq 'FORMAT_CHECK_ONLY'){'PASS'}else{'FAIL'}
            $report.status=$report.korean_5000
            if($report.korean_5000 -ne 'PASS'){throw 'actual_windows_gui_korean_5000_quality_gate_failed'}
            Write-Host 'EXTERNAL_WINDOWS_GUI_GGUF_KOREAN_5000_SCOPE_PASS_NOT_LITERARY_OR_HUMAN_CERTIFICATION'
          } catch {
            $report.error_code= if($report.current_stage){$report.current_stage}else{'unknown'}
            $report.last_ui_control=$script:last_ui_control
            $report.failure_type=$_.Exception.GetType().Name
            $safeMessage=$_.Exception.Message
            if($safeMessage -match '^(gui_|model_|compiled_exe_|uia_|bundled_|actual_windows_gui_|real_model_)') { $report.failure_code=$safeMessage }
            Write-Host ('EXTERNAL_WINDOWS_GUI_QA_FAIL_STAGE='+$report.error_code)
          } finally {
            $dest='build/ci/korean-real-gui'
            New-Item -Path $dest -ItemType Directory -Force | Out-Null
            $report | ConvertTo-Json -Depth 6 | Out-File (Join-Path $dest 'metadata.json') -Encoding utf8
            if($process){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          }
          if($report.status -ne 'PASS'){throw ('real_compiled_windows_gui_korean_5000_FAIL_stage_'+$report.current_stage)}
      - name: Preserve CI synthetic original prose for human reading and sanitized metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-native-windows-gui-korean-quality-evidence-${{ matrix.os }}
          path: |
            build/ci/korean-real-gui/metadata.json
            build/ci/korean-real-gui/qa_original_scene.txt
          if-no-files-found: warn
          retention-days: 7
