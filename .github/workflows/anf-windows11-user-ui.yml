name: ANF Windows 11 real desktop QA (VALIDATION ONLY)
on:
  push:
    branches: [validation/gui-authoring-e2e-20261014]
  workflow_dispatch:
# Validation-only: a newer candidate supersedes a queued earlier candidate.
# Do not change the pre-existing hourly/scheduled workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qa-exe-x64-build:
    if: github.ref == 'refs/heads/validation/gui-authoring-e2e-20261014'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build requirements
        run: python -m pip install -e ".[desktop,build]"
      - name: Fetch pinned SIL OFL Korean font for offline packaged GUI
        run: python scripts/prepare_gui_font.py
      - name: Build unsigned x64 Windows EXE
        run: python scripts/build_windows_exe.py --report build/ci/windows11-build.json
      - name: Keep synthetic Windows build diagnostics (never include novels or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-windows-build-diagnostics
          retention-days: 3
          if-no-files-found: warn
          path: |
            build/stage97/build_stdout.txt
            build/stage97/build_stderr.txt
            build/stage97/smoke_check_stdout.txt
            build/stage97/smoke_check_stderr.txt
            build/stage97/smoke_gui-smoke_stdout.txt
            build/stage97/smoke_gui-smoke_stderr.txt
            build/ci/windows11-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: anf-x64-exe-to-windows11-qa
          path: dist/stage97/AI_Novel_Factory.exe
          retention-days: 3
          if-no-files-found: error
  windows11-native-desktop:
    needs: qa-exe-x64-build
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: anf-x64-exe-to-windows11-qa
          path: build/ci/windows11-exe
      - name: Confirm Windows 11 and run x64 EXE through ARM64 emulation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("Windows OS: " + $os.Caption + "; version " + $os.Version)
          if ($os.Caption -notmatch 'Windows 11') { throw 'Not a Windows 11 desktop' }
          $exe = (Resolve-Path 'build/ci/windows11-exe/AI_Novel_Factory.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--gui-smoke' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged x64 EXE GUI smoke failed in Windows 11 emulation" }
      - name: Click and render all 12 GUI pages in compiled Windows 11 EXE (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path 'build/ci/windows11-exe/AI_Novel_Factory.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--ci-win11-qt-ui', 'build/ci/windows11-qt' -PassThru -Wait
          if (Test-Path 'build/ci/windows11-qt/windows11_qt_report.json') {
            Get-Content 'build/ci/windows11-qt/windows11_qt_report.json'
          }
          if ($p.ExitCode -ne 0) { throw 'Actual Qt navigation/rendering on Windows 11 failed' }
      - name: EXTERNAL native Windows 11 user actions via OS UIAutomation (no in-process Qt)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/ci_windows11_external_authoring.ps1 ./build/ci/windows11-exe/AI_Novel_Factory.exe
          if (-not $?) { throw 'External user UIAutomation test failed' }
      - name: Inspect real Windows 11 interactive GUI, select all menus, capture desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/ci_windows11_desktop.ps1 ./build/ci/windows11-exe/AI_Novel_Factory.exe
          if (-not $?) { throw 'Windows 11 native UI Automation script failed' }
      - name: Preserve external real GUI user-action results (never upload novel DB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-native-external-user-actions
          retention-days: 5
          if-no-files-found: warn
          path: build/ci/windows11-native-user/external_user_report.json
      - name: Preserve offscreen Windows 11 Qt page snapshots (synthetic data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-offscreen-qt-12-screens
          retention-days: 3
          if-no-files-found: warn
          path: build/ci/windows11-qt/
      - name: Preserve desktop screenshot only (no manuscripts or model)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-actual-desktop-probe
          retention-days: 3
          if-no-files-found: ignore
          path: |
            build/ci/windows11/actual_desktop.png
            build/ci/windows11/native_app_window.png
