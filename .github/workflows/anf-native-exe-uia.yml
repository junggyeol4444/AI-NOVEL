name: ANF actual Windows compiled EXE UIA user journey (TEST BRANCH ONLY)
on:
  push:
    branches:
      - validation/windows-binary-ui-100
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-compiled-exe-ui:
    if: github.ref == 'refs/heads/validation/windows-binary-ui-100'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ANF_AI_PROVIDER: disabled
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies and Windows UIAutomation tool on TEST runner only
        shell: pwsh
        run: |
          python -m pip install -e ".[desktop,api,database,queue,documents,graphics,quality,dev,build]"
          python -m pip install pywinauto==0.6.9
      - name: Create real Windows EXE
        shell: pwsh
        run: |
          python scripts/build_windows_exe.py --report build/ci/native_uia_build.json
          exit $LASTEXITCODE
      - name: Control ACTUAL compiled binary with Windows UI Automation
        shell: pwsh
        run: |
          python -u scripts/ci_native_exe_uia.py
          exit $LASTEXITCODE
      - name: Always save actual UI control inventory and blocking user steps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-binary-uia-evidence-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci/native_uia_build.json
            build/ci/native_ui_controls.json
            build/ci/native_windows_exe_user_journey.json
