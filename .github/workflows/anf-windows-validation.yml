name: AI Novel Factory Windows validation (TEST BRANCH ONLY)

on:
  push:
    branches:
      - validation/windows-ci-100
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anf-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-validation:
    if: github.ref == 'refs/heads/validation/windows-ci-100'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      ANF_AI_PROVIDER: disabled
      ANF_ENV: test
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.12 isolated Windows runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test/build dependencies on test runner only
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,api,database,queue,documents,graphics,quality,dev,build]"
          python -m pip freeze | Out-File -FilePath build-dependencies.txt -Encoding utf8

      - name: Windows Python full unittest regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$((Get-Location).Path)\src;$((Get-Location).Path)\tests"
          $failedGroups = @()
          foreach ($n in 1..8) {
            python scripts/stage99_partitioned_regression.py --prefix build/ci/regression --start $n --end $n
            if ($LASTEXITCODE -ne 0) { $failedGroups += $n }
          }
          if ($failedGroups.Count -gt 0) {
            Write-Error "Failed Windows regression groups: $($failedGroups -join ',')"
            exit 1
          }
          python scripts/stage99_partitioned_regression.py --prefix build/ci/regression --aggregate
          exit $LASTEXITCODE

      - name: PyInstaller Windows EXE build and smoke
        if: always()
        shell: pwsh
        run: |
          python scripts/build_windows_exe.py --report build/ci/stage97_build.json
          exit $LASTEXITCODE

      - name: Real Windows runner EXE and regression acceptance
        if: always()
        shell: pwsh
        run: |
          python scripts/stage99_windows_acceptance.py --report build/ci/stage99_windows.json
          exit $LASTEXITCODE

      - name: Release audit (BLOCKED expected until official API/user acceptance)
        if: always()
        shell: pwsh
        run: |
          python scripts/stage100_release_audit.py --report build/ci/stage100_release_audit.json
          $rc = $LASTEXITCODE
          if ($rc -eq 2) {
            Write-Host 'Expected: release BLOCKED, pending 95/96 official platform and user/physical acceptance.'
            exit 0
          }
          exit $rc

      - name: Executable checksum (test artifact, NOT approved release)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'dist/stage97/AI_Novel_Factory.exe') {
            Get-FileHash -Algorithm SHA256 'dist/stage97/AI_Novel_Factory.exe' |
              Format-List | Out-File -FilePath exe-sha256.txt -Encoding utf8
          }

      - name: Upload local test evidence, no manuscript or secret files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-windows-branch-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/ci/*.json
            build/ci/*_exit.txt
            build/ci/*_stderr.txt
            build/ci/*_stdout.txt
            build/stage97/*.txt
            build/stage99/*.json
            build/stage99/*_exit.txt
            build/stage99/*_stderr.txt
            build/stage99/*_stdout.txt
            build-dependencies.txt
            exe-sha256.txt
            dist/stage97/AI_Novel_Factory.exe
