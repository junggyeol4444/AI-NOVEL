name: ANF real-model to EPUB and TXT end-to-end test (TEST BRANCH ONLY)
on:
  push:
    branches:
      - validation/e2e-offline-ci-100
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-e2e:
    if: github.ref == 'refs/heads/validation/e2e-offline-ci-100'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      ANF_AI_PROVIDER: disabled
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline CPU model runtime on ephemeral test runner only
        run: |
          python -m pip install -e .
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.48.3' 'huggingface_hub==0.28.1'
      - name: Download public compact test model weights, not a hosted inference API
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='HuggingFaceTB/SmolLM2-135M-Instruct',local_dir='build/ci/model')
          PY
      - name: Run local model to TXT upload drafts and EPUB3 in full offline mode
        env:
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_OFFLINE: '1'
        run: python scripts/ci_e2e_offline.py --run "$GITHUB_WORKSPACE/build/ci/model"
      - name: Check AI-generated synthetic EPUB3 with real W3C EPUBCheck 5.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl -fL --retry 3 -o build/tools/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q build/tools/epubcheck.zip -d build/tools/epubcheck
          JAR="$(find build/tools/epubcheck -iname 'epubcheck.jar' -print -quit)"
          test -n "$JAR"
          java -jar "$JAR" build/ci/synthetic/book.epub \
            -out build/ci/e2e_epubcheck.xml | tee build/ci/e2e_epubcheck_console.txt
          grep -q "0 fatals / 0 errors / 0 warnings" build/ci/e2e_epubcheck_console.txt
      - name: Upload metadata and validator evidence only, not novel or model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anf-real-e2e-metadata-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/ci/real_model_to_epub_txt.json
            build/ci/e2e_epubcheck.xml
            build/ci/e2e_epubcheck_console.txt
