[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-novel-factory"
version = "0.1.0"
description = "AI Novel Factory: Windows desktop and backend services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Proprietary - pending owner decision"}
dependencies = []

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8,<7",
  "httpx>=0.27,<1",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
]
database = [
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
]
queue = [
  "celery>=5.4,<6",
  "redis>=5,<7",
]
documents = [
  "EbookLib>=0.18,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
]
graphics = [
  "Pillow>=10.4,<13",
]
quality = [
  "rapidfuzz>=3.10,<4",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]
build = [
  "pyinstaller>=6.10,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_novel_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.uv]
package = true
